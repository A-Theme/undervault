    render();
  }
  function removeTake(id) {
    var i = takes.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    var t = takes[i];
    stopPlaying();
    if (t.url) URL.revokeObjectURL(t.url);
    takes.splice(i, 1);
    dropTake(id);
    if (t.best) {
      var rest = takesFor(t.lineId);
      if (rest.length) {
        rest[rest.length - 1].best = true;
        persistTake(rest[rest.length - 1]);
      }
    }
    render();
  }
  function stopPlaying() {
    if (playing && playing.audio) {
      try { playing.audio.pause(); } catch (e) {}
    }
    playing = null;
    Array.prototype.forEach.call(document.querySelectorAll('#takes-list button'), function (b) {
      if (b.dataset.playing) {
        b.textContent = ui.play;
        delete b.dataset.playing;
      }
    });
  }
  function playTake(t, btn) {
    if (playing && playing.take === t) { stopPlaying(); return; }
    stopPlaying();
    var audio = new Audio(t.url);
    playing = { take: t, audio: audio };
    btn.textContent = ui.playing;
    btn.dataset.playing = '1';
    audio.onended = function () { if (playing && playing.take === t) stopPlaying(); };
    audio.onerror = function () { stopPlaying(); setStatus(ui.playFail, 'err'); };
    audio.play().catch(function () { stopPlaying(); });
  }

  function setMeter(rms) {
    var pct = Math.min(100, Math.round(Math.sqrt(rms) * 280));
    var meterBar = $('meter').querySelector('span');
    meterBar.style.width = pct + '%';
    $('meter').classList.toggle('hot', pct > 70);
    $('meter').setAttribute('aria-valuenow', String(pct));
  }
  function tickMeter() {
    if (!rec.anal) return;
    var buf = new Uint8Array(rec.anal.fftSize);
    rec.anal.getByteTimeDomainData(buf);
    var s = 0, i, v;
    for (i = 0; i < buf.length; i++) { v = (buf[i] - 128) / 128; s += v * v; }
    setMeter(Math.sqrt(s / buf.length));
    rec.raf = requestAnimationFrame(tickMeter);
  }
  function clearTimer() {
    if (rec.timerIv) { clearInterval(rec.timerIv); rec.timerIv = 0; }
    $('timer').textContent = '';
  }
  function stopTracks() {
    if (rec.raf) { cancelAnimationFrame(rec.raf); rec.raf = 0; }
    try { if (rec.proc) rec.proc.disconnect(); } catch (e) {}
    try { if (rec.src) rec.src.disconnect(); } catch (e) {}
    try { if (rec.anal) rec.anal.disconnect(); } catch (e) {}
    try { if (rec.mute) rec.mute.disconnect(); } catch (e) {}
    if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); });
    var ctx = rec.ctx;
    rec.proc = rec.src = rec.anal = rec.mute = rec.stream = rec.ctx = null;
    if (ctx && ctx.close) ctx.close();
    setMeter(0);
  }
  function setRecUi(on) {
    var btnRec = $('btn-rec');
    var btnStop = $('btn-stop');
    btnRec.setAttribute('aria-pressed', on ? 'true' : 'false');
    btnRec.classList.toggle('recording', on);
    btnRec.textContent = on ? ui.recording : ui.record;
    btnStop.disabled = !on;
  }

  async function startRec() {
    if (rec.on) return;
    if (!selectedId) return;
    var stream;
    try {
      stream = await getUserMediaAudio();
    } catch (err) {
      if (insecureMicContext()) $('secure-banner').hidden = false;
      else if (!navigator.mediaDevices && !navigator.getUserMedia && !navigator.webkitGetUserMedia) {
        $('secure-banner').hidden = false;
        setStatus(ui.noMic, 'err');
        return;
      }
      setStatus((insecureMicContext() ? ui.micDeniedFile : ui.micDenied) +
        (err && err.message ? ' ' + err.message : ''), 'err');
      return;
    }
    var ctx;
    try { ctx = openAudioContext(); } catch (e) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      setStatus(ui.noMic, 'err');
      return;
    }
    if (ctx.state === 'suspended' && ctx.resume) await ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var anal = ctx.createAnalyser();
    anal.fftSize = 2048;
    var proc = ctx.createScriptProcessor(4096, 1, 1);
    var chunks = [];
    proc.onaudioprocess = function (e) {
      chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    var mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(anal);
    src.connect(proc);
    proc.connect(mute);
    mute.connect(ctx.destination);
    rec.on = true;
    rec.mute = mute;
    rec.stream = stream;
    rec.ctx = ctx;
    rec.src = src;
    rec.proc = proc;
    rec.anal = anal;
    rec.chunks = chunks;
    rec.startedAt = Date.now();
    setRecUi(true);
    setStatus(ui.listening, '');
    tickMeter();
    rec.timerIv = setInterval(function () {
      var t = (Date.now() - rec.startedAt) / 1000;
      $('timer').textContent = fmt(ui.timer, { t: t.toFixed(1), max: MAX_SEC });
      if (t >= MAX_SEC) stopRec();
    }, 100);
    try { localStorage.setItem(DB_NAME + '-who', displayWho()); } catch (e) {}
  }

  function stopRec() {
    if (!rec.on) return;
    rec.on = false;
    rec.holding = false;
    clearTimer();
    var chunks = rec.chunks;
    var sr = rec.ctx ? rec.ctx.sampleRate : 48000;
    stopTracks();
    setRecUi(false);

    var total = chunks.reduce(function (a, c) { return a + c.length; }, 0);
    var all = new Float32Array(total);
    var o = 0;
    chunks.forEach(function (c) { all.set(c, o); o += c.length; });
    var at48 = resampleTo(all, sr, OUT_SR);
    var trimmed = trimSilence(at48, OUT_SR, PAD_SEC);
    if (!trimmed) {
      setStatus(ui.noVoice, 'err');
      return;
    }
    var wav = encodeWavPcm24Mono(trimmed, OUT_SR);
    var take = {
      id: nextId++,
      lineId: selectedId,
      who: displayWho(),
      samples: trimmed.length,
      wav: wav,
      url: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })),
      at: Date.now(),
      best: false
    };
    addTake(take);
    setStatus(ui.saved, 'ok');
  }

  function toggleRec() {
    if (rec.on) stopRec(); else startRec();
  }

  function zipFolder() { return 'narration-' + N.lang; }
  function readmeText(kind) {
    var folder = zipFolder();
    var langArg = N.lang === 'en' ? '' : ' ' + N.lang;
    var linesOut = [
      ui.readmeTitle,
      '',
      kind === 'best' ? ui.readmeBest : ui.readmeAll,
      '',
      'node tools/voice.js ' + folder + langArg,
      'npm run build && npm test',
      '',
      ui.readmeFormat
    ];
    return linesOut.join('\n') + '\n';
  }
  function downloadBest() {
    var files = [];
    var missing = [];
    lines.forEach(function (l) {
      var t = bestFor(l.id);
      if (!t) { missing.push(l.id); return; }
      files.push({ name: zipFolder() + '/' + l.id + '.wav', data: new Uint8Array(t.wav) });
    });
    if (!files.length) {
      setStatus(ui.needBest, 'err');
      return;
    }
    files.push({
      name: zipFolder() + '/README.txt',
      data: new TextEncoder().encode(readmeText('best'))
    });
    var zip = zipStore(files);
    var name = 'narration-' + N.lang + '-best.zip';
    var msg = fmt(ui.bestZip, { name: name, n: files.length - 1, missing: missing.join(', ') });
    if (missing.length) msg += ' ' + fmt(ui.bestMissing, { missing: missing.join(', ') });
    downloadBlob(new Blob([zip], { type: 'application/zip' }), name).then(function (how) {
      if (how === 'abort') return;
      setStatus(how === 'share' ? afterDownload(name, msg) : msg, missing.length ? '' : 'ok');
    });
  }
  function downloadAll() {
    if (!takes.length) return;
    var files = [];
    var folder = zipFolder();
    lines.forEach(function (l) {
      var t = bestFor(l.id);
      if (t) files.push({ name: folder + '/' + l.id + '.wav', data: new Uint8Array(t.wav) });
      takesFor(l.id).forEach(function (x, i) {
        files.push({
          name: folder + '/all-takes/' + l.id + '-take' + (i + 1) + '.wav',
          data: new Uint8Array(x.wav)
        });
      });
    });
    files.push({
      name: folder + '/README.txt',
      data: new TextEncoder().encode(readmeText('all'))
    });
    var zip = zipStore(files);
    var name = 'narration-' + N.lang + '-all.zip';
    var msg = fmt(ui.allZip, { name: name, n: takes.length });
    downloadBlob(new Blob([zip], { type: 'application/zip' }), name).then(function (how) {
      if (how === 'abort') return;
      setStatus(how === 'share' ? afterDownload(name, msg) : msg, 'ok');
    });
  }

  function buildPage() {
    var names = N.names || [];
    var nameRows = names.map(function (r) {
      return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.say) + '</td><td>' + esc(r.notes) + '</td></tr>';
    }).join('');
    var langLinks = (N.langLinks || []).map(function (x) {
      if (x.lang === N.lang) return '<a href="' + esc(x.href) + '" aria-current="page">' + esc(x.label) + '</a>';
      return '<a href="' + esc(x.href) + '">' + esc(x.label) + '</a>';
    }).join(' · ');
    var serveUrl = ui.serveUrl;
    var bannerHtml = ui.banner
      .split('{cmd}').join('<code>' + esc(ui.serveCmd) + '</code>')
      .split('{link}').join('<a href="' + esc(serveUrl) + '">' + esc(serveUrl) + '</a>');

    document.title = ui.docTitle;
    document.documentElement.lang = N.lang;
    document.body.innerHTML =
      '<a class="skip" href="#line-list">' + esc(ui.skip) + '</a>' +
      '<main>' +
        '<p class="eyebrow">' + esc(ui.eyebrow) + '</p>' +
        '<h1>' + esc(ui.title) + '</h1>' +
        '<p class="lead">' + esc(ui.lead) + '</p>' +
        '<p class="langs">' + langLinks + '</p>' +
        '<div id="secure-banner" class="banner" hidden>' + bannerHtml + '</div>' +
        '<p id="progress"></p>' +
        '<div class="layout">' +
          '<aside class="panel" aria-labelledby="list-heading">' +
            '<h2 id="list-heading">' + esc(ui.lineList) + '</h2>' +
            '<div id="line-list" class="lines"></div>' +
          '</aside>' +
          '<div>' +
            '<section class="phrase" aria-label="' + esc(ui.script) + '">' +
              '<p class="film" id="line-film"></p>' +
              '<h2 id="line-heading"></h2>' +
              '<p class="spoken" id="spoken"></p>' +
              '<p class="notes" id="notes"></p>' +
            '</section>' +
            '<div class="nav-lines">' +
              '<button type="button" id="btn-prev">' + esc(ui.prev) + '</button>' +
              '<button type="button" id="btn-next">' + esc(ui.next) + '</button>' +
            '</div>' +
            '<details class="guide">' +
              '<summary>' + esc(ui.voiceTitle) + '</summary>' +
              '<p>' + esc(ui.voiceBody) + '</p>' +
              (names.length ? '<table><thead><tr><th>' + esc(ui.colName) + '</th><th>' + esc(ui.colSay) + '</th><th>' + esc(ui.colNotes) + '</th></tr></thead><tbody>' + nameRows + '</tbody></table>' : '') +
            '</details>' +
            '<form id="rec-form" action="#" method="get">' +
              '<label class="field" for="who">' + esc(ui.speaker) + '</label>' +
              '<input id="who" name="who" type="text" autocomplete="name" spellcheck="false" placeholder="' + esc(ui.speakerPh) + '">' +
              '<p class="file-preview" id="file-preview"></p>' +
              '<div class="meter-wrap">' +
                '<div class="label" id="meter-label">' + esc(ui.meter) + '</div>' +
                '<div class="meter" id="meter" role="meter" aria-labelledby="meter-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>' +
              '</div>' +
              '<p id="status" aria-live="polite">' + esc(ui.ready) + '</p>' +
              '<p id="timer" aria-live="off"></p>' +
              '<div class="actions">' +
                '<button type="button" class="primary" id="btn-rec" aria-pressed="false">' + esc(ui.record) + '</button>' +
                '<button type="button" id="btn-stop" disabled>' + esc(ui.stop) + '</button>' +
              '</div>' +
              '<p class="hint">' + esc(ui.spaceHint) + '</p>' +
            '</form>' +
            '<section class="takes" aria-labelledby="takes-heading">' +
              '<h2 id="takes-heading">' + esc(ui.takes) + '</h2>' +
              '<p id="counter"></p>' +
              '<ul class="list" id="takes-list"></ul>' +
              '<div class="actions">' +
                '<button type="button" id="btn-best" disabled>' + esc(ui.downloadBest) + '</button>' +
                '<button type="button" id="btn-all" disabled>' + esc(ui.downloadAll) + '</button>' +
                '<button type="button" class="danger" id="btn-clear" disabled>' + esc(ui.clearAll) + '</button>' +
              '</div>' +
            '</section>' +
            '<section class="how" aria-labelledby="how-heading">' +
              '<h2 id="how-heading">' + esc(ui.afterTitle) + '</h2>' +
              '<p>' + esc(ui.afterBody) + '</p>' +
              '<p><code>' + esc(ui.afterCmd) + '</code></p>' +
              '<p><code>npm run build &amp;&amp; npm test</code></p>' +
              '<p>' + esc(ui.formatNote) + '</p>' +
            '</section>' +
          '</div>' +
        '</div>' +
        '<footer><p>' + esc(ui.footer) + '</p></footer>' +
      '</main>';

    $('rec-form').addEventListener('submit', function (e) { e.preventDefault(); toggleRec(); });
    $('btn-rec').addEventListener('click', function (e) {
      if (rec.ignoreClick) { rec.ignoreClick = false; return; }
      toggleRec();
    });
    $('btn-stop').addEventListener('click', function () { stopRec(); });
    $('btn-rec').addEventListener('pointerdown', function (e) {
      /* On a phone, Record is tap-to-toggle (there is no spacebar). Hold-to-record
         is mouse only, so a slightly long tap does not start and then stop. */
      if (e.button) return;
      if (e.pointerType && e.pointerType !== 'mouse') return;
      rec.holdTimer = setTimeout(function () {
        rec.holding = true;
        if (!rec.on) startRec();
      }, 350);
    });
    function endHold() {
      if (rec.holdTimer) { clearTimeout(rec.holdTimer); rec.holdTimer = null; }
      if (rec.holding) {
        rec.holding = false;
        rec.ignoreClick = true;
        if (rec.on) stopRec();
      }
    }
    window.addEventListener('pointerup', endHold);
    window.addEventListener('pointercancel', endHold);
    $('btn-prev').addEventListener('click', function () {
      var i = lines.findIndex(function (l) { return l.id === selectedId; });
      if (i > 0) selectLine(lines[i - 1].id);
    });
    $('btn-next').addEventListener('click', function () {
      var i = lines.findIndex(function (l) { return l.id === selectedId; });
      if (i >= 0 && i < lines.length - 1) selectLine(lines[i + 1].id);
    });
    $('btn-best').addEventListener('click', downloadBest);
    $('btn-all').addEventListener('click', downloadAll);
    $('btn-clear').addEventListener('click', function () {
      if (!takes.length) return;
      if (!window.confirm(ui.confirmClear)) return;
      stopPlaying();
      takes.forEach(function (t) { if (t.url) URL.revokeObjectURL(t.url); });
      takes = [];
      clearStore();
      render();
      setStatus(ui.cleared, '');
    });
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if ((e.code === 'Space' || e.key === ' ') && !typing) {
        if (e.repeat) return;
        e.preventDefault();
        toggleRec();
        return;
      }
      if (e.key === 'Escape' && rec.on) { e.preventDefault(); stopRec(); return; }
      if (typing) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var i = lines.findIndex(function (l) { return l.id === selectedId; });
        if (i > 0) selectLine(lines[i - 1].id);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var j = lines.findIndex(function (l) { return l.id === selectedId; });
        if (j >= 0 && j < lines.length - 1) selectLine(lines[j + 1].id);
      }
    });
  }

  buildPage();

  openDb().then(function (d) {
    db = d;
    return loadTakes();
  }).then(function () {
    try {
      var savedWho = localStorage.getItem(DB_NAME + '-who');
      if (savedWho && $('who') && !$('who').value) $('who').value = savedWho;
      var savedLine = localStorage.getItem(DB_NAME + '-line');
      if (savedLine && lineById[savedLine]) selectedId = savedLine;
    } catch (e) {}
    render();
  });
})();
  </script>
</body>
</html>
