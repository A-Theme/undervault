    if (!gum) return Promise.reject(new Error('no getUserMedia'));
    /* iOS Safari ignores sampleRate and may reject a strict constraint object.
       Try the preferred rate, then the same constraints without it, then {audio:true}.
       Output is always resampled to OUT_SR below. */
    var preferred = {
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,

    };
    var relaxed = {
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,

    return gum(preferred).catch(function () {
      return gum(relaxed);
    }).catch(function () {

  function insecureMicContext() {

  function openDb() {

        if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE, { keyPath: 'id' });

  function persistTake(t) {
    if (!db) return;
    var recd = {
      id: t.id,
      lineId: t.lineId,
      best: !!t.best,
      who: t.who || '',
      samples: t.samples,
      wav: t.wav,
      at: t.at || Date.now()

  function loadTakes() {
    return new Promise(function (resolve) {
      if (!db) { resolve(); return; }
      var req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).getAll();
      req.onsuccess = function () {
        var rows = req.result || [];
        rows.sort(function (a, b) { return (a.at || 0) - (b.at || 0) || a.id - b.id; });
        rows.forEach(function (r) {
          if (!lineById[r.lineId] || !r.wav) return;
          var wav = r.wav;
          takes.push({
            id: r.id,
            lineId: r.lineId,
            best: !!r.best,
            who: r.who || '',
            samples: r.samples || 0,
            wav: wav,
            url: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })),
            at: r.at || Date.now()
          });
          if (r.id >= nextId) nextId = r.id + 1;
        });
        resolve();

      req.onerror = function () { resolve(); };
    });

  function markBest(t) {
    takesFor(t.lineId).forEach(function (o) {

      if (was !== o.best) persistTake(o);
    });
    render();
  }
  function addTake(t) {
    var existing = takesFor(t.lineId);
    t.best = existing.length === 0;
    if (t.best) {
      /* first take on this line is the best until another is marked */
    }
    takes.push(t);

  function removeTake(id) {
    var i = takes.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    var t = takes[i];

    if (t.url) URL.revokeObjectURL(t.url);

  function setMeter(rms) {
    var pct = Math.min(100, Math.round(Math.sqrt(rms) * 280));

    if (!rec.anal) return;

    var s = 0, i, v;
    for (i = 0; i < buf.length; i++) { v = (buf[i] - 128) / 128; s += v * v; }

    try { if (rec.anal) rec.anal.disconnect(); } catch (e) {}
    try { if (rec.mute) rec.mute.disconnect(); } catch (e) {}
    if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); });
    var ctx = rec.ctx;
    rec.proc = rec.src = rec.anal = rec.mute = rec.stream = rec.ctx = null;
    if (ctx && ctx.close) ctx.close();

  async function startRec() {
    if (rec.on) return;
    if (!selectedId) return;
    var stream;
    try {
      stream = await getUserMediaAudio();
    } catch (err) {
      if (insecureMicContext()) $('secure-banner').hidden = false;
      else if (!navigator.mediaDevices && !navigator.getUserMedia && !navigator.webkitGetUserMedia) {
        $('secure-banner').hidden = false;
        setStatus(ui.noMic, 'err');
        return;
      }
      setStatus((insecureMicContext() ? ui.micDeniedFile : ui.micDenied) +
        (err && err.message ? ' ' + err.message : ''), 'err');
      return;
    }
    var ctx;
    try { ctx = openAudioContext(); } catch (e) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      setStatus(ui.noMic, 'err');
      return;
    }
    if (ctx.state === 'suspended' && ctx.resume) await ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var anal = ctx.createAnalyser();
    anal.fftSize = 2048;
    var proc = ctx.createScriptProcessor(4096, 1, 1);
    var chunks = [];
    proc.onaudioprocess = function (e) {
      chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    var mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(anal);
    src.connect(proc);
    proc.connect(mute);
    mute.connect(ctx.destination);
    rec.on = true;
    rec.mute = mute;
    rec.stream = stream;
    rec.ctx = ctx;
    rec.src = src;
    rec.proc = proc;
    rec.anal = anal;
    rec.chunks = chunks;
    rec.startedAt = Date.now();
    setRecUi(true);
    setStatus(ui.listening, '');
    tickMeter();
    rec.timerIv = setInterval(function () {
      var t = (Date.now() - rec.startedAt) / 1000;
      $('timer').textContent = fmt(ui.timer, { t: t.toFixed(1), max: MAX_SEC });
      if (t >= MAX_SEC) stopRec();
    }, 100);
    try { localStorage.setItem(DB_NAME + '-who', displayWho()); } catch (e) {}
  }

  function stopRec() {
    if (!rec.on) return;
    rec.on = false;
    rec.holding = false;
    clearTimer();
    var chunks = rec.chunks;
    var sr = rec.ctx ? rec.ctx.sampleRate : 48000;
    stopTracks();
    setRecUi(false);

    var total = chunks.reduce(function (a, c) { return a + c.length; }, 0);
    var all = new Float32Array(total);
    var o = 0;
    chunks.forEach(function (c) { all.set(c, o); o += c.length; });
    var at48 = resampleTo(all, sr, OUT_SR);
    var trimmed = trimSilence(at48, OUT_SR, PAD_SEC);
    if (!trimmed) {
      setStatus(ui.noVoice, 'err');
      return;
    }
    var wav = encodeWavPcm24Mono(trimmed, OUT_SR);
    var take = {
      id: nextId++,
      lineId: selectedId,
      who: displayWho(),
      samples: trimmed.length,
      wav: wav,
      url: URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })),
      at: Date.now(),
      best: false
    };
    addTake(take);
    setStatus(ui.saved, 'ok');
  }

        rec.holding = false;
        rec.ignoreClick = true;
        if (rec.on) stopRec();
      }
    }
    window.addEventListener('pointerup', endHold);
    window.addEventListener('pointercancel', endHold);
    $('btn-prev').addEventListener('click', function () {
      var i = lines.findIndex(function (l) { return l.id === selectedId; });
      if (i > 0) selectLine(lines[i - 1].id);
    });
    $('btn-next').addEventListener('click', function () {
      var i = lines.findIndex(function (l) { return l.id === selectedId; });
      if (i >= 0 && i < lines.length - 1) selectLine(lines[i + 1].id);
    });
    $('btn-best').addEventListener('click', downloadBest);
    $('btn-all').addEventListener('click', downloadAll);
    $('btn-clear').addEventListener('click', function () {
      if (!takes.length) return;
      if (!window.confirm(ui.confirmClear)) return;
      stopPlaying();
      takes.forEach(function (t) { if (t.url) URL.revokeObjectURL(t.url); });
      takes = [];
      clearStore();
      render();
      setStatus(ui.cleared, '');
    });
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if ((e.code === 'Space' || e.key === ' ') && !typing) {
        if (e.repeat) return;
        e.preventDefault();
        toggleRec();
        return;
      }
      if (e.key === 'Escape' && rec.on) { e.preventDefault(); stopRec(); return; }
      if (typing) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var i = lines.findIndex(function (l) { return l.id === selectedId; });
        if (i > 0) selectLine(lines[i - 1].id);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var j = lines.findIndex(function (l) { return l.id === selectedId; });
        if (j >= 0 && j < lines.length - 1) selectLine(lines[j + 1].id);
      }
    });
  }

  buildPage();

  openDb().then(function (d) {
    db = d;
    return loadTakes();
  }).then(function () {
    try {
      var savedWho = localStorage.getItem(DB_NAME + '-who');
      if (savedWho && $('who') && !$('who').value) $('who').value = savedWho;
      var savedLine = localStorage.getItem(DB_NAME + '-line');
      if (savedLine && lineById[savedLine]) selectedId = savedLine;
    } catch (e) {}
    render();
  });
})();
  </script>
</body>
</html>
